<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 220px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #fff;
  }
  .header {
    padding: 10px 12px 6px;
    font-size: 11px;
    font-weight: 600;
    color: #6b7177;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    text-decoration: none;
    color: #1a1a1a;
    border: none;
    background: none;
    width: 100%;
    font-size: 13px;
    text-align: left;
    font-family: inherit;
  }
  .menu-item:hover { background: #f3f4f6; }
  .menu-item svg { flex-shrink: 0; width: 16px; height: 16px; }
  .divider { height: 1px; background: #e5e7eb; margin: 4px 0; }
  #toggle-item .status {
    margin-left: auto;
    font-size: 11px;
    color: #6b7177;
  }
  #no-store { padding: 12px; color: #6b7177; text-align: center; }
</style>
</head>
<body>
  <div id="content">
    <div id="toggle-section">
      <button class="menu-item" id="toggle-item">
        <svg id="toggle-icon-visible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="toggle-icon-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        <span>Toggle Preview Bar</span>
        <span class="status" id="bar-status"></span>
      </button>
    </div>
    <div class="divider" id="links-divider"></div>
    <div class="header">Quick Links</div>
    <div id="links"></div>
  </div>
  <div id="no-store" style="display:none">Not a Shopify store</div>
  <script src="popup.js"></script>
</body>
</html>
